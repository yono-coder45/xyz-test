name: Bot Scanner Multi-Timeframe

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      MODE: ${{ vars.MODE || 'normal' }}
      PIONEX_API_HOST_PRIMARY: ${{ vars.PIONEX_API_HOST_PRIMARY || 'https://api.pionex.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fase 1–3 · Collection, filter, analisis
        run: python bot-analisis.py

      - name: Fase 4 · Report & evaluasi
        if: always()
        run: python bot-report.py

      - name: Commit state (cool_down.json)
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add cool_down.json
          git diff --cached --quiet || (git commit -m "state: run ${GITHUB_RUN_ID}" && git push)
